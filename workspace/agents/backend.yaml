# Agent: backend
# Source: source-repo/profiles/backend.json
apiVersion: anvio.io/v1
kind: Agent
metadata:
  name: backend
  version: "1.0.0"
spec:
  # display name: Backend
  description: Backend engineer — APIs, business logic, data layer
  persona: backend
  soul: backend-soul
  runtime:
    provider: claude-code   # ADR-009: Claude Pro/Max OAuth via `anvio setup-token --claude`
    fallbacks: [cursor, local]        # model provider (routing.yaml) used only on the `local` hop
  skills:
    - cursor-delegate
    - cursor-coding
    - golang-microservice
    - postgres-optimization
    - redis-patterns
    - kafka-consumer
    - event-driven-design
    - api-design
    - security-review
    - performance-review
    - testing-strategy
    - clean-architecture
    - ddd
    - bitbucket-cli
    - bitbucket-pr-workflow
    - repo-conventions
    - semantic-memory
  tools: []              # empty = full built-in gateway; list slugs to restrict
  model:
    # ClaudeCodeRuntime passes spec.model.model straight to the Claude Agent SDK,
    # so this MUST be a Claude model id/alias — not the DeepSeek fallback model.
    provider: anthropic
    model: sonnet
    maxTokens: 8192
