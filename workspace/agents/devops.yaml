# Agent: devops
# Source: source-repo/profiles/devops.json
apiVersion: anvio.io/v1
kind: Agent
metadata:
  name: devops
  version: "1.0.0"
spec:
  # display name: DevOps
  description: DevOps — infrastructure, CI/CD, observability
  persona: devops
  soul: devops-soul
  runtime:
    provider: claude-code   # ADR-009: Claude Pro/Max OAuth via `anvio setup-token --claude`
    fallbacks: [local]        # model provider (routing.yaml) used only on the `local` hop
  skills:
    - kubernetes-deployment
    - helm-generator
    - terraform
    - observability-stack
    - prometheus-metrics
    - grafana-dashboard
    - opentelemetry
    - security-hardening
    - disaster-recovery
    - incident-response
    - repo-standards
  tools: []              # empty = full built-in gateway; list slugs to restrict
  model:
    # ClaudeCodeRuntime passes spec.model.model straight to the Claude Agent SDK,
    # so this MUST be a Claude model id/alias — not the DeepSeek fallback model.
    provider: anthropic
    model: sonnet
    maxTokens: 8192
