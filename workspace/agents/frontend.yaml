# Agent: frontend
# Source: source-repo/profiles/frontend.json
apiVersion: anvio.io/v1
kind: Agent
metadata:
  name: frontend
  version: "1.0.0"
spec:
  # display name: Frontend
  description: Frontend engineer — UI, components, accessibility
  persona: frontend
  soul: frontend-soul
  runtime:
    provider: claude-code   # ADR-009: Claude Pro/Max OAuth via `anvio setup-token --claude`
    fallbacks: [cursor, local]        # model provider (routing.yaml) used only on the `local` hop
  skills:
    - cursor-delegate
    - cursor-coding
    - react-architecture
    - nextjs
    - design-system
    - accessibility
    - frontend-performance
    - api-integration
    - testing-strategy
    - tdd
    - repo-conventions
  tools: []              # empty = full built-in gateway; list slugs to restrict
  model:
    # ClaudeCodeRuntime passes spec.model.model straight to the Claude Agent SDK,
    # so this MUST be a Claude model id/alias — not the DeepSeek fallback model.
    provider: anthropic
    model: sonnet
    maxTokens: 8192
