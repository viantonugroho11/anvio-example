# Agent: reviewer
# Source: source-repo/profiles/reviewer.json
# Note: reviewer is the required quality gate for code_change / deploy actions.
apiVersion: anvio.io/v1
kind: Agent
metadata:
  name: reviewer
  version: "1.0.0"
spec:
  # display name: Reviewer
  description: Gatekeeper — code, security, performance review
  persona: reviewer
  soul: reviewer-soul
  runtime:
    provider: claude-code   # ADR-009: Claude Pro/Max OAuth via `anvio setup-token --claude`
    fallbacks: [cursor, local]        # model provider (routing.yaml) used only on the `local` hop
  skills:
    - cursor-delegate
    - cursor-code-review
    - code-review
    - architecture-review
    - security-review
    - performance-review
  tools: []              # empty = full built-in gateway; list slugs to restrict
  model:
    # ClaudeCodeRuntime passes spec.model.model straight to the Claude Agent SDK,
    # so this MUST be a Claude model id/alias — not the DeepSeek fallback model.
    provider: anthropic
    model: sonnet
    maxTokens: 8192
