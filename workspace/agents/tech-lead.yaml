# Agent: tech-lead
# Source: source-repo/profiles/tech-lead.json
# Default entry point per Hermes planner (complexity >= 0.3 starts at tech-lead).
apiVersion: anvio.io/v1
kind: Agent
metadata:
  name: tech-lead
  version: "1.0.0"
spec:
  # display name: Tech Lead
  description: Tech lead — planning, estimation, delegation
  persona: tech-lead
  soul: tech-lead-soul
  runtime:
    provider: claude-code   # ADR-009: Claude Pro/Max OAuth via `anvio setup-token --claude`
    fallbacks: [local]        # model provider (routing.yaml) used only on the `local` hop
  skills:
    - engineering-orchestration
    - roadmap-planning
    - project-estimation
    - risk-analysis
    - system-design
    - feature-development
    - memory-maintenance
    - semantic-memory
  tools: []              # empty = full built-in gateway; list slugs to restrict
  model:
    # ClaudeCodeRuntime passes spec.model.model straight to the Claude Agent SDK,
    # so this MUST be a Claude model id/alias — not the DeepSeek fallback model.
    provider: anthropic
    model: sonnet
    maxTokens: 8192
