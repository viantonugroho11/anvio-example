# Agent: architect
# Source: source-repo/profiles/architect.json
# Binds soul + persona + skills + runtime for execution.
apiVersion: anvio.io/v1
kind: Agent
metadata:
  name: architect
  version: "1.0.0"
spec:
  # display name: Architect
  description: System architect — design, ADRs, scalability and reliability analysis
  persona: architect
  soul: architect-soul
  runtime:
    provider: claude-code   # ADR-009: Claude Pro/Max OAuth via `anvio setup-token --claude`
    fallbacks: [local]        # model provider (routing.yaml) used only on the `local` hop
  skills:
    - system-design
    - architecture-review
    - event-storming
    - distributed-systems
    - architecture-decision-record
    - performance-modeling
    - reliability-engineering
    - clean-architecture
    - ddd
    - event-driven-design
    - api-design
    - semantic-memory
  # Toolsets from Hermes (`file`, `web`, `skills`, `mcp`, `todo`) map to Anvio's
  # default built-in tool gateway plus MCP. No explicit include list = full surface.
  tools: []              # empty = full built-in gateway; list slugs to restrict
  model:
    # ClaudeCodeRuntime passes spec.model.model straight to the Claude Agent SDK,
    # so this MUST be a Claude model id/alias — not the DeepSeek fallback model.
    provider: anthropic
    model: sonnet
    maxTokens: 8192
