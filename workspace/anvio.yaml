# Anvio Workspace — Hermes Engineering Platform (migrated)
# Source of truth for global runtime config. Replaces configs/config.yaml.
apiVersion: anvio.io/v1
kind: Workspace
metadata:
  name: hermes-engineering-platform
  version: "1.0.0"
spec:
  auth:
    enabled: false
  storage:
    provider: sqlite         # Hermes preserved session history; SQLite gives FTS5 message search
    basePath: .
  memory:
    provider: filesystem     # SoT lives in workspace/memory/ Markdown; ADR-005 covers vector indexing
    basePath: memory
    fts: true
  events:
    provider: local          # single-process default; switch to nats for Level-3
  runtime:
    default: claude-code     # ADR-009: Claude Pro/Max subscription OAuth (`anvio setup-token --claude`)
                             # Per-agent fallback chains live in agents/*.yaml (spec.runtime.fallbacks).
  execution:
    defaultTimeoutMs: 180000 # matches Hermes terminal.timeout: 180
    networkEnabled: false
  credentials:
    encryption: enabled
  channels:
    telegram:
      enabled: true          # long-polling Bot API — no webhook/public URL needed
      # botToken resolves from TELEGRAM_BOT_TOKEN (.env) — never commit the literal token here.
      defaultAgent: tech-lead
      # Forum topics map to sessions via message_thread_id; approvals render as inline buttons.
    slack:
      enabled: false         # off until SLACK_BOT_TOKEN + SLACK_APP_TOKEN exist (ADR-008 keeps the design)
      defaultAgent: tech-lead
    cli:
      enabled: true
    rest:
      enabled: true
    web-chat:
      enabled: true
  a2a:
    enabled: true            # ADR-0026: A2A protocol — agent-to-agent interoperability (v2.4.0)
    # Exposes /.well-known/agent.json + /a2a/* on the unified gateway.
    # Agent Cards auto-generated from agents/*.yaml frontmatter.
    # External A2A agents can be registered as tools via A2ATool.
  worktrees:
    enabled: true            # cursor delegation clones Bitbucket repos under ../projects
    repoPath: ../projects
  defaultAgent: tech-lead    # Hermes's planner starts from tech-lead for complexity >= 0.3
  defaultSoul: tech-lead-soul
  defaultUserId: local-user
